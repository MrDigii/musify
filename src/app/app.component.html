<main class="container">
    <h1 class="text-3xl">Welcome to Tauri + Angular!</h1>

    <div class="row">
        <a href="https://tauri.app" target="_blank">
            <img src="/assets/tauri.svg" class="logo tauri" alt="Tauri logo" />
        </a>
        <a href="https://angular.io" target="_blank">
            <img src="/assets/angular.svg" class="logo angular" alt="Angular logo" />
        </a>
    </div>
    <p>Click on the logos to learn more about the frameworks</p>

    <!--
    <form class="row" (submit)="greet($event, greetInput.value)">
        <input #greetInput id="greet-input" placeholder="{{ inputPlaceholder }}" />
        <button z-button type="submit">Greet</button>
    </form>
    -->
    <p>{{ greetingMessage }}</p>

    <button z-button type="button" (click)="selectFolder()">Ordner auswählen</button>
    @if (selectedFolder) {
    <p>{{ selectedFolder }}</p>
    <ul>
        @for (file of files; track file) {
        <li>{{ file }}</li>
        } @empty {
        <li>Keine Dateien gefunden</li>
        }
    </ul>
    }

    <router-outlet />
</main>
